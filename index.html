<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartShell • Сверка склада</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090c14;
      --card-bg: rgba(18, 24, 38, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover: rgba(255, 255, 255, 0.12);
      --text-main: #f1f5f9;
      --text-muted: #808ea3;
      --accent: #00f2fe;
      --accent-glow: rgba(0, 242, 254, 0.3);
      --accent-grad: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      --danger: #ff3b69;
      --danger-bg: rgba(255, 59, 105, 0.12);
      --success: #00e676;
      --success-bg: rgba(0, 230, 118, 0.12);
      --warning: #ffab00;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(0, 242, 254, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(79, 172, 254, 0.05) 0%, transparent 40%);
      background-attachment: fixed;
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      padding: 24px 16px;
    }

    .container { max-width: 1000px; margin: 0 auto; }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-icon {
      width: 40px;
      height: 40px;
      background: var(--accent-grad);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px var(--accent-glow);
    }
    .brand-icon svg { width: 22px; height: 22px; fill: #000; }
    
    .brand-text h1 {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(180deg, #fff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand-text p { font-size: 0.8rem; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }

    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 18px;
      transition: border-color 0.2s;
    }
    .glass-card:hover { border-color: var(--card-hover); }

    .auth-grid {
      display: grid;
      grid-template-columns: 1.4fr 1fr 1fr auto;
      gap: 10px;
      align-items: center;
    }

    @media (max-width: 768px) {
      .auth-grid { grid-template-columns: 1fr; }
    }

    input, select {
      background: rgba(10, 14, 23, 0.8);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.9rem;
      outline: none;
      transition: all 0.2s;
    }
    input:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    button {
      background: var(--accent-grad);
      color: #040914;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 10px 18px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: transform 0.15s, box-shadow 0.2s;
    }
    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 20px var(--accent-glow);
    }
    button:active { transform: translateY(0); }

    .btn-report {
      background: linear-gradient(135deg, #00e676 0%, #00b0ff 100%);
      box-shadow: 0 0 16px rgba(0, 230, 118, 0.25);
    }

    .stats-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }
    .stat-box {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 14px 16px;
      position: relative;
      overflow: hidden;
    }
    .stat-box::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 4px; height: 100%;
      background: var(--accent);
    }
    .stat-box.deficit::before { background: var(--danger); }
    .stat-box.surplus::before { background: var(--accent); }
    .stat-box.progress::before { background: var(--success); }

    .stat-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); font-weight: 600; }
    .stat-val { font-size: 1.45rem; font-weight: 800; margin-top: 4px; font-family: 'JetBrains Mono', monospace; }
    .stat-val.red { color: var(--danger); text-shadow: 0 0 10px rgba(255, 59, 105, 0.3); }
    .stat-val.blue { color: var(--accent); text-shadow: 0 0 10px var(--accent-glow); }
    .stat-val.green { color: var(--success); text-shadow: 0 0 10px rgba(0, 230, 118, 0.3); }

    .filters-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .filters-bar input { flex: 1; min-width: 200px; }

    .table-wrapper {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      overflow-x: auto;
    }

    table { width: 100%; border-collapse: collapse; }
    th {
      background: rgba(255, 255, 255, 0.02);
      padding: 14px 16px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      border-bottom: 1px solid var(--card-border);
      text-align: left;
    }
    td {
      padding: 14px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
      vertical-align: middle;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover { background: rgba(255, 255, 255, 0.02); }

    .item-category {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--accent);
      background: rgba(0, 242, 254, 0.08);
      padding: 2px 8px;
      border-radius: 6px;
      display: inline-block;
      margin-bottom: 4px;
      font-family: 'JetBrains Mono', monospace;
    }
    .item-title { font-weight: 600; font-size: 0.95rem; color: #fff; }

    .stock-badge {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 4px 10px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      display: inline-block;
    }

    .fact-control {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .fact-input {
      width: 65px;
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.05rem;
      font-weight: 700;
      padding: 6px 8px;
    }

    .quick-btn {
      width: 32px;
      height: 32px;
      padding: 0;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-main);
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      transition: background 0.15s;
    }
    .quick-btn:hover { background: rgba(255, 255, 255, 0.15); box-shadow: none; transform: none; }

    .diff-badge {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 4px 8px;
      border-radius: 6px;
      display: inline-block;
      white-space: nowrap;
    }
    .diff-deficit { background: var(--danger-bg); color: var(--danger); border: 1px solid rgba(255, 59, 105, 0.3); }
    .diff-surplus { background: rgba(0, 242, 254, 0.12); color: var(--accent); border: 1px solid rgba(0, 242, 254, 0.3); }
    .diff-ok { background: var(--success-bg); color: var(--success); }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #00e676;
      color: #000;
      padding: 12px 20px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.9rem;
      display: none;
      box-shadow: 0 10px 30px rgba(0, 230, 118, 0.4);
      z-index: 1000;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
      </div>
      <div class="brand-text">
        <h1>SMARTSHELL AUDIT</h1>
        <p>REVISION MATRIX // VER. 2.0</p>
      </div>
    </div>
    <button class="btn-report" onclick="copyTelegramReport()">
      <svg style="width:16px;height:16px;fill:currentColor" viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
      Скопировать отчёт в TG
    </button>
  </header>

  <!-- Панель входа / API -->
  <div class="glass-card">
    <div class="auth-grid">
      <input type="text" id="workerUrl" placeholder="Cloudflare Worker URL" value="https://smartshell-bridge.ruslan12rudan.workers.dev">
      <input type="text" id="loginInput" placeholder="Логин (телефон)">
      <input type="password" id="passInput" placeholder="Пароль">
      <button onclick="fetchStock()">
        <svg style="width:16px;height:16px;fill:currentColor" viewBox="0 0 24 24"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg>
        Загрузить склад
      </button>
    </div>
  </div>

  <!-- Статистика смены -->
  <div class="stats-container">
    <div class="stat-box progress">
      <div class="stat-label">Прогресс проверки</div>
      <div class="stat-val green" id="statChecked">0 / 0</div>
    </div>
    <div class="stat-box deficit">
      <div class="stat-label">Недостача</div>
      <div class="stat-val red" id="statDeficit">0 ₽</div>
    </div>
    <div class="stat-box surplus">
      <div class="stat-label">Излишек</div>
      <div class="stat-val blue" id="statSurplus">0 ₽</div>
    </div>
  </div>

  <!-- Панель фильтров -->
  <div class="filters-bar">
    <input type="text" id="searchInput" placeholder="Быстрый поиск позиции (клавиша /)..." oninput="renderTable()">
    <select id="categoryFilter" onchange="renderTable()">
      <option value="ALL">Все категории</option>
    </select>
    <select id="diffFilter" onchange="renderTable()">
      <option value="ALL">Все товары</option>
      <option value="DIFF">Только расхождения (≠ 0)</option>
      <option value="DEFICIT">Только недостачи (< 0)</option>
      <option value="UNCHECKED">Ещё не посчитано</option>
    </select>
  </div>

  <!-- Сетка товаров -->
  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>Категория и позиция</th>
          <th style="width: 100px; text-align: center;">Цена</th>
          <th style="width: 90px; text-align: center;">Шелл</th>
          <th style="width: 190px; text-align: center;">Факт</th>
          <th style="width: 150px; text-align: right;">Разница</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr>
          <td colspan="5" style="text-align: center; color: var(--text-muted); padding: 48px;">
            Введите данные и нажмите «Загрузить склад» для инициализации
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<div class="toast" id="toast">✓ Отчёт сформирован и скопирован в буфер!</div>

<script>
  let goodsData = [];

  window.addEventListener('DOMContentLoaded', () => {
    if (localStorage.getItem('ss_worker')) document.getElementById('workerUrl').value = localStorage.getItem('ss_worker');
    if (localStorage.getItem('ss_login')) document.getElementById('loginInput').value = localStorage.getItem('ss_login');
    if (localStorage.getItem('ss_pass')) document.getElementById('passInput').value = localStorage.getItem('ss_pass');

    window.addEventListener('keydown', (e) => {
      if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
        e.preventDefault();
        document.getElementById('searchInput').focus();
      }
    });
  });

  async function fetchStock() {
    const workerUrl = document.getElementById('workerUrl').value.trim();
    const login = document.getElementById('loginInput').value.trim();
    const password = document.getElementById('passInput').value.trim();

    localStorage.setItem('ss_worker', workerUrl);
    localStorage.setItem('ss_login', login);
    localStorage.setItem('ss_pass', password);

    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; padding: 48px; color: var(--accent);">Синхронизация со SmartShell API...</td></tr>';

    try {
      const loginRes = await fetch(`${workerUrl}/api/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ login, password, company_id: 6682 })
      });
      const loginData = await loginRes.json();
      if (!loginRes.ok) throw new Error(loginData.error || 'Ошибка входа');

      const token = loginData.token;

      const goodsRes = await fetch(`${workerUrl}/api/goods`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const data = await goodsRes.json();
      if (!goodsRes.ok) throw new Error(data.error || 'Ошибка получения товаров');

      goodsData = data.map(item => ({
        ...item,
        actual: ''
      }));

      updateCategories();
      renderTable();
      updateStats();

    } catch (err) {
      alert("Ошибка: " + err.message);
      tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--danger); padding: 48px;">${err.message}</td></tr>`;
    }
  }

  function updateCategories() {
    const categories = Array.from(new Set(goodsData.map(g => g.category)));
    const select = document.getElementById('categoryFilter');
    select.innerHTML = '<option value="ALL">Все категории</option>';
    categories.forEach(cat => {
      select.innerHTML += `<option value="${cat}">${cat}</option>`;
    });
  }

  function setQuickFact(id, mode) {
    const item = goodsData.find(g => g.id === id);
    if (!item) return;

    if (mode === 'EQUAL') {
      item.actual = item.amount;
    } else if (mode === 'PLUS') {
      const cur = item.actual === '' ? item.amount : Number(item.actual);
      item.actual = cur + 1;
    } else if (mode === 'MINUS') {
      const cur = item.actual === '' ? item.amount : Number(item.actual);
      item.actual = Math.max(0, cur - 1);
    }
    renderTable(false);
    updateStats();
  }

  function onFactChange(id, value) {
    const item = goodsData.find(g => g.id === id);
    if (!item) return;
    item.actual = value === '' ? '' : Number(value);
    renderTable(false);
    updateStats();
  }

  function handleInputKeydown(e, currentIndex) {
    if (e.key === 'Enter') {
      e.preventDefault();
      const inputs = Array.from(document.querySelectorAll('.fact-input'));
      if (currentIndex + 1 < inputs.length) {
        inputs[currentIndex + 1].focus();
        inputs[currentIndex + 1].select();
      }
    }
  }

  function renderTable(full = true) {
    const tbody = document.getElementById('tableBody');
    const search = document.getElementById('searchInput').value.toLowerCase();
    const category = document.getElementById('categoryFilter').value;
    const diffFilter = document.getElementById('diffFilter').value;

    const filtered = goodsData.filter(g => {
      const matchSearch = g.title.toLowerCase().includes(search);
      const matchCat = category === 'ALL' || g.category === category;
      const diff = g.actual === '' ? 0 : (g.actual - g.amount);

      let matchDiff = true;
      if (diffFilter === 'DIFF') matchDiff = (g.actual !== '' && diff !== 0);
      if (diffFilter === 'DEFICIT') matchDiff = (g.actual !== '' && diff < 0);
      if (diffFilter === 'UNCHECKED') matchDiff = (g.actual === '');

      return matchSearch && matchCat && matchDiff;
    });

    tbody.innerHTML = filtered.map((item, index) => {
      const hasActual = item.actual !== '';
      const diff = hasActual ? (item.actual - item.amount) : 0;
      let diffHtml = '<span style="color:var(--text-muted);font-size:0.85rem;">—</span>';

      if (hasActual) {
        if (diff === 0) {
          diffHtml = '<span class="diff-badge diff-ok">✓ Норма</span>';
        } else if (diff < 0) {
          diffHtml = `<span class="diff-badge diff-deficit">${diff} шт (${diff * item.cost} ₽)</span>`;
        } else {
          diffHtml = `<span class="diff-badge diff-surplus">+${diff} шт (+${diff * item.cost} ₽)</span>`;
        }
      }

      return `
        <tr>
          <td>
            <span class="item-category">${item.category}</span>
            <div class="item-title">${item.title}</div>
          </td>
          <td style="text-align: center; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; font-size: 0.9rem;">
            ${item.cost} ₽
          </td>
          <td style="text-align: center;">
            <span class="stock-badge">${item.amount}</span>
          </td>
          <td style="text-align: center;">
            <div class="fact-control">
              <button class="quick-btn" title="Совпадает с шеллом" onclick="setQuickFact(${item.id}, 'EQUAL')">✓</button>
              <button class="quick-btn" onclick="setQuickFact(${item.id}, 'MINUS')">−</button>
              <input type="number" 
                     class="fact-input" 
                     value="${item.actual !== '' ? item.actual : ''}" 
                     placeholder="—"
                     onkeydown="handleInputKeydown(event, ${index})"
                     oninput="onFactChange(${item.id}, this.value)">
              <button class="quick-btn" onclick="setQuickFact(${item.id}, 'PLUS')">+</button>
            </div>
          </td>
          <td style="text-align: right;">${diffHtml}</td>
        </tr>
      `;
    }).join('');
  }

  function updateStats() {
    let checkedCount = 0;
    let deficitSum = 0;
    let surplusSum = 0;

    goodsData.forEach(g => {
      if (g.actual !== '') {
        checkedCount++;
        const diff = g.actual - g.amount;
        if (diff < 0) deficitSum += Math.abs(diff) * g.cost;
        if (diff > 0) surplusSum += diff * g.cost;
      }
    });

    document.getElementById('statChecked').innerText = `${checkedCount} / ${goodsData.length}`;
    document.getElementById('statDeficit').innerText = `-${deficitSum} ₽`;
    document.getElementById('statSurplus').innerText = `+${surplusSum} ₽`;
  }

  function copyTelegramReport() {
    const now = new Date();
    const dateStr = now.toLocaleDateString('ru-RU') + ' ' + now.toLocaleTimeString('ru-RU', {hour: '2-digit', minute:'2-digit'});

    let report = `📊 *РЕВИЗИЯ БАРА // ${dateStr}*\n`;
    report += `━━━━━━━━━━━━━━━━━━━━━\n\n`;

    const deficits = [];
    const surpluses = [];
    let totalDeficit = 0;

    goodsData.forEach(g => {
      if (g.actual !== '') {
        const diff = g.actual - g.amount;
        if (diff < 0) {
          deficits.push(`🔴 ${g.title}: ${diff} шт (${diff * g.cost} ₽)`);
          totalDeficit += Math.abs(diff) * g.cost;
        } else if (diff > 0) {
          surpluses.push(`🔵 ${g.title}: +${diff} шт (+${diff * g.cost} ₽)`);
        }
      }
    });

    if (deficits.length === 0 && surpluses.length === 0) {
      report += `✅ *Все позиции сходятся, недостач нет!*\n`;
    } else {
      if (deficits.length > 0) {
        report += `*Недостачи:*\n${deficits.join('\n')}\n\n`;
      }
      if (surpluses.length > 0) {
        report += `*Излишки:*\n${surpluses.join('\n')}\n\n`;
      }
      report += `━━━━━━━━━━━━━━━━━━━━━\n`;
      report += `*ИТОГОВАЯ СУММА НЕДОСТАЧИ:* -${totalDeficit} ₽\n`;
    }

    navigator.clipboard.writeText(report).then(() => {
      const toast = document.getElementById('toast');
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 2200);
    });
  }
</script>
</body>
</html>
