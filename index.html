<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SmartShell • Сверка склада</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090c14;
      --card-bg: rgba(18, 24, 38, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover: rgba(255, 255, 255, 0.14);
      --text-main: #f1f5f9;
      --text-muted: #808ea3;
      --accent: #00f2fe;
      --accent-glow: rgba(0, 242, 254, 0.25);
      --accent-grad: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      --danger: #ff3b69;
      --danger-bg: rgba(255, 59, 105, 0.12);
      --success: #00e676;
      --success-bg: rgba(0, 230, 118, 0.12);
      --bar-color: #a855f7;
      --wh-color: #3b82f6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 10% 10%, rgba(0, 242, 254, 0.06) 0%, transparent 40%),
        radial-gradient(circle at 90% 90%, rgba(79, 172, 254, 0.04) 0%, transparent 40%);
      background-attachment: fixed;
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      padding: 16px 12px;
    }

    .container { max-width: 960px; margin: 0 auto; }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-icon {
      width: 38px; height: 38px;
      background: var(--accent-grad);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 16px var(--accent-glow);
    }
    .brand-icon svg { width: 20px; height: 20px; fill: #000; }
    .brand-text h1 { font-size: 1.2rem; font-weight: 800; color: #fff; }
    .brand-text p { font-size: 0.7rem; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }

    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .auth-grid {
      display: grid;
      grid-template-columns: 1.2fr 1fr 1fr auto;
      gap: 8px;
    }

    input, select {
      background: rgba(10, 14, 23, 0.85);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
    }
    input:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    button {
      background: var(--accent-grad);
      color: #040914;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 10px 14px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-report {
      background: linear-gradient(135deg, #00e676 0%, #00b0ff 100%);
      box-shadow: 0 0 14px rgba(0, 230, 118, 0.25);
    }

    .stats-container {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }
    .stat-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 10px 12px;
      position: relative;
    }
    .stat-box::before {
      content: ''; position: absolute; top: 0; left: 0; width: 3px; height: 100%;
      background: var(--accent);
    }
    .stat-box.deficit::before { background: var(--danger); }
    .stat-box.surplus::before { background: var(--accent); }
    .stat-box.progress::before { background: var(--success); }

    .stat-label { font-size: 0.65rem; text-transform: uppercase; color: var(--text-muted); font-weight: 700; }
    .stat-val { font-size: 1.15rem; font-weight: 800; margin-top: 2px; font-family: 'JetBrains Mono', monospace; }
    .stat-val.red { color: var(--danger); }
    .stat-val.blue { color: var(--accent); }
    .stat-val.green { color: var(--success); }

    .filters-bar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }
    .filters-bar input { grid-column: span 2; }

    /* Таблица для ПК */
    .desktop-table-wrapper { display: block; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th {
      background: rgba(255, 255, 255, 0.02);
      padding: 12px 14px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
      border-bottom: 1px solid var(--card-border);
      text-align: left;
    }
    td { padding: 12px 14px; border-bottom: 1px solid rgba(255, 255, 255, 0.03); vertical-align: middle; }

    .item-category {
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--accent);
      background: rgba(0, 242, 254, 0.08);
      padding: 2px 6px;
      border-radius: 4px;
      display: inline-block;
      margin-bottom: 3px;
      font-family: 'JetBrains Mono', monospace;
    }
    .item-title { font-weight: 600; font-size: 0.95rem; color: #fff; }

    .stock-badge {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 0.9rem;
      padding: 3px 8px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 6px;
      display: inline-block;
    }

    .dual-inputs {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .dual-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .dual-label {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      font-family: 'JetBrains Mono', monospace;
    }
    .dual-label.bar { color: var(--bar-color); }
    .dual-label.wh { color: var(--wh-color); }

    .fact-input {
      width: 54px;
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 1rem;
      font-weight: 700;
      padding: 6px 4px;
    }

    .diff-badge {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 0.8rem;
      padding: 3px 7px;
      border-radius: 6px;
      display: inline-block;
      white-space: nowrap;
    }
    .diff-deficit { background: var(--danger-bg); color: var(--danger); border: 1px solid rgba(255, 59, 105, 0.3); }
    .diff-surplus { background: rgba(0, 242, 254, 0.12); color: var(--accent); border: 1px solid rgba(0, 242, 254, 0.3); }
    .diff-ok { background: var(--success-bg); color: var(--success); }

    /* Мобильные карточки */
    .mobile-cards { display: none; gap: 10px; flex-direction: column; }

    .item-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: border-color 0.2s;
    }
    .item-card.has-deficit { border-color: rgba(255, 59, 105, 0.35); background: rgba(255, 59, 105, 0.05); }
    .item-card.has-surplus { border-color: rgba(0, 242, 254, 0.35); background: rgba(0, 242, 254, 0.05); }
    .item-card.has-ok { border-color: rgba(0, 230, 118, 0.3); }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card-meta {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card-price {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .card-title {
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.25;
    }

    .card-bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 10px;
    }
    .card-stock {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .card-stock-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 600;
    }

    .total-pill {
      font-size: 0.8rem;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-muted);
      margin-top: 4px;
    }

    @media (max-width: 768px) {
      .auth-grid { grid-template-columns: 1fr; }
      .desktop-table-wrapper { display: none; }
      .mobile-cards { display: flex; }
      header { flex-direction: column; align-items: stretch; }
      .btn-report { width: 100%; height: 42px; font-size: 0.95rem; }
      .fact-input { width: 62px; height: 42px; font-size: 1.15rem; }
    }

    .toast {
      position: fixed;
      bottom: 16px; right: 16px; left: 16px;
      text-align: center;
      background: #00e676; color: #000;
      padding: 12px; border-radius: 10px;
      font-weight: 700; display: none;
      box-shadow: 0 10px 25px rgba(0, 230, 118, 0.4);
      z-index: 1000;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
      </div>
      <div class="brand-text">
        <h1>SMARTSHELL AUDIT</h1>
        <p>REVISION // BAR & WAREHOUSE</p>
      </div>
    </div>
    <button class="btn-report" onclick="copyTelegramReport()">
      <svg style="width:16px;height:16px;fill:currentColor" viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
      Скопировать отчёт в TG
    </button>
  </header>

  <!-- Блок входа -->
  <div class="glass-card">
    <div class="auth-grid">
      <input type="text" id="workerUrl" placeholder="Воркер URL" value="https://smartshell-bridge.ruslan12rudan.workers.dev">
      <input type="text" id="loginInput" placeholder="Логин (телефон)">
      <input type="password" id="passInput" placeholder="Пароль">
      <button onclick="fetchStock()">Загрузить склад</button>
    </div>
  </div>

  <!-- Статистика -->
  <div class="stats-container">
    <div class="stat-box progress">
      <div class="stat-label">Прогресс</div>
      <div class="stat-val green" id="statChecked">0 / 0</div>
    </div>
    <div class="stat-box deficit">
      <div class="stat-label">Недостача</div>
      <div class="stat-val red" id="statDeficit">0 ₽</div>
    </div>
    <div class="stat-box surplus">
      <div class="stat-label">Излишек</div>
      <div class="stat-val blue" id="statSurplus">0 ₽</div>
    </div>
  </div>

  <!-- Фильтры -->
  <div class="filters-bar">
    <input type="text" id="searchInput" placeholder="Поиск товара (/)..." oninput="renderTable()">
    <select id="categoryFilter" onchange="renderTable()">
      <option value="ALL">Все категории</option>
    </select>
    <select id="diffFilter" onchange="renderTable()">
      <option value="ALL">Все товары</option>
      <option value="DIFF">Только расхождения (≠ 0)</option>
      <option value="DEFICIT">Только недостачи (< 0)</option>
      <option value="UNCHECKED">Ещё не посчитано</option>
    </select>
  </div>

  <!-- ПК: Таблица -->
  <div class="glass-card desktop-table-wrapper" style="padding:0;">
    <table>
      <thead>
        <tr>
          <th>Категория и позиция</th>
          <th style="width: 80px; text-align: center;">Цена</th>
          <th style="width: 80px; text-align: center;">Шелл</th>
          <th style="width: 220px; text-align: center;">Бар + Склад = Факт</th>
          <th style="width: 140px; text-align: right;">Разница</th>
        </tr>
      </thead>
      <tbody id="desktopTableBody">
        <tr><td colspan="5" style="text-align: center; color: var(--text-muted); padding: 40px;">Нажмите «Загрузить склад»</td></tr>
      </tbody>
    </table>
  </div>

  <!-- Смартфон: Карточки -->
  <div class="mobile-cards" id="mobileCardsContainer">
    <div style="text-align: center; color: var(--text-muted); padding: 30px;">Нажмите «Загрузить склад» для начала</div>
  </div>
</div>

<div class="toast" id="toast">✓ Отчёт скопирован в буфер!</div>

<script>
  let goodsData = [];

  window.addEventListener('DOMContentLoaded', () => {
    if (localStorage.getItem('ss_worker')) document.getElementById('workerUrl').value = localStorage.getItem('ss_worker');
    if (localStorage.getItem('ss_login')) document.getElementById('loginInput').value = localStorage.getItem('ss_login');
    if (localStorage.getItem('ss_pass')) document.getElementById('passInput').value = localStorage.getItem('ss_pass');

    window.addEventListener('keydown', (e) => {
      if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
        e.preventDefault();
        document.getElementById('searchInput').focus();
      }
    });
  });

  async function fetchStock() {
    const workerUrl = document.getElementById('workerUrl').value.trim();
    const login = document.getElementById('loginInput').value.trim();
    const password = document.getElementById('passInput').value.trim();

    localStorage.setItem('ss_worker', workerUrl);
    localStorage.setItem('ss_login', login);
    localStorage.setItem('ss_pass', password);

    document.getElementById('desktopTableBody').innerHTML = '<tr><td colspan="5" style="text-align: center; padding: 40px; color: var(--accent);">Синхронизация с сервером SmartShell...</td></tr>';
    document.getElementById('mobileCardsContainer').innerHTML = '<div style="text-align: center; padding: 30px; color: var(--accent);">Синхронизация с сервером SmartShell...</div>';

    try {
      const loginRes = await fetch(`${workerUrl}/api/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ login, password, company_id: 6682 })
      });
      const loginData = await loginRes.json();
      if (!loginRes.ok) throw new Error(loginData.error || 'Ошибка входа');

      const token = loginData.token;

      const goodsRes = await fetch(`${workerUrl}/api/goods`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const data = await goodsRes.json();
      if (!goodsRes.ok) throw new Error(data.error || 'Ошибка получения товаров');

      // Инициализируем раздельный факт: bar (бар) и wh (склад)
      goodsData = data.map(item => ({
        ...item,
        bar: '',
        wh: ''
      }));

      updateCategories();
      renderTable();
      updateStats();

    } catch (err) {
      alert("Ошибка: " + err.message);
      document.getElementById('desktopTableBody').innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--danger); padding: 40px;">${err.message}</td></tr>`;
      document.getElementById('mobileCardsContainer').innerHTML = `<div style="text-align: center; color: var(--danger); padding: 30px;">${err.message}</div>`;
    }
  }

  function updateCategories() {
    const categories = Array.from(new Set(goodsData.map(g => g.category)));
    const select = document.getElementById('categoryFilter');
    select.innerHTML = '<option value="ALL">Все категории</option>';
    categories.forEach(cat => {
      select.innerHTML += `<option value="${cat}">${cat}</option>`;
    });
  }

  // Обновление факта без перерисовки всей страницы (клавиатура не закрывается!)
  function updateItemFact(id, field, value) {
    const item = goodsData.find(g => g.id === id);
    if (!item) return;

    item[field] = value === '' ? '' : Number(value);

    // Синхронизируем инпуты между десктопом и мобильным видом
    const selector = `input[data-id="${id}"][data-field="${field}"]`;
    document.querySelectorAll(selector).forEach(input => {
      if (input !== document.activeElement) {
        input.value = item[field];
      }
    });

    // Локально обновляем бейджи разницы и цвета карточки
    updateSingleItemDisplay(item);
    updateStats();
  }

  function getItemTotalFact(item) {
    if (item.bar === '' && item.wh === '') return null;
    return (Number(item.bar) || 0) + (Number(item.wh) || 0);
  }

  function updateSingleItemDisplay(item) {
    const total = getItemTotalFact(item);
    const hasFact = (total !== null);
    const diff = hasFact ? (total - item.amount) : 0;

    let badgeHtml = '<span style="color:var(--text-muted);font-size:0.85rem;">—</span>';
    let cardClass = 'item-card';

    if (hasFact) {
      if (diff === 0) {
        badgeHtml = '<span class="diff-badge diff-ok">✓ Норма</span>';
        cardClass += ' has-ok';
      } else if (diff < 0) {
        badgeHtml = `<span class="diff-badge diff-deficit">${diff} шт (${diff * item.cost} ₽)</span>`;
        cardClass += ' has-deficit';
      } else {
        badgeHtml = `<span class="diff-badge diff-surplus">+${diff} шт (+${diff * item.cost} ₽)</span>`;
        cardClass += ' has-surplus';
      }
    }

    // Обновляем разницу в таблице десктопа
    const desktopDiff = document.getElementById(`diff-desktop-${item.id}`);
    if (desktopDiff) desktopDiff.innerHTML = badgeHtml;

    // Обновляем разницу и сумму факта в мобильной карточке
    const mobileDiff = document.getElementById(`diff-mobile-${item.id}`);
    if (mobileDiff) mobileDiff.innerHTML = badgeHtml;

    const mobileTotal = document.getElementById(`total-mobile-${item.id}`);
    if (mobileTotal) {
      mobileTotal.innerHTML = hasFact ? `Факт: <b>${total} шт</b>` : `Факт: —`;
    }

    const card = document.getElementById(`card-${item.id}`);
    if (card) {
      card.className = cardClass;
    }
  }

  function handleDesktopEnter(e, nextSelector) {
    if (e.key === 'Enter') {
      e.preventDefault();
      const nextInput = document.querySelector(nextSelector);
      if (nextInput) {
        nextInput.focus();
        nextInput.select();
      }
    }
  }

  function renderTable() {
    const search = document.getElementById('searchInput').value.toLowerCase();
    const category = document.getElementById('categoryFilter').value;
    const diffFilter = document.getElementById('diffFilter').value;

    const filtered = goodsData.filter(g => {
      const matchSearch = g.title.toLowerCase().includes(search);
      const matchCat = category === 'ALL' || g.category === category;
      const total = getItemTotalFact(g);
      const hasFact = (total !== null);
      const diff = hasFact ? (total - g.amount) : 0;

      let matchDiff = true;
      if (diffFilter === 'DIFF') matchDiff = (hasFact && diff !== 0);
      if (diffFilter === 'DEFICIT') matchDiff = (hasFact && diff < 0);
      if (diffFilter === 'UNCHECKED') matchDiff = !hasFact;

      return matchSearch && matchCat && matchDiff;
    });

    // Рендер таблицы Десктопа
    const desktopBody = document.getElementById('desktopTableBody');
    desktopBody.innerHTML = filtered.map((item, index) => {
      const total = getItemTotalFact(item);
      const hasFact = (total !== null);
      const diff = hasFact ? (total - item.amount) : 0;

      let badgeHtml = '<span style="color:var(--text-muted);font-size:0.85rem;">—</span>';
      if (hasFact) {
        if (diff === 0) badgeHtml = '<span class="diff-badge diff-ok">✓ Норма</span>';
        else if (diff < 0) badgeHtml = `<span class="diff-badge diff-deficit">${diff} шт (${diff * item.cost} ₽)</span>`;
        else badgeHtml = `<span class="diff-badge diff-surplus">+${diff} шт (+${diff * item.cost} ₽)</span>`;
      }

      return `
        <tr>
          <td>
            <span class="item-category">${item.category}</span>
            <div class="item-title">${item.title}</div>
          </td>
          <td style="text-align: center; color: var(--text-muted); font-family: 'JetBrains Mono', monospace;">${item.cost} ₽</td>
          <td style="text-align: center;"><span class="stock-badge">${item.amount}</span></td>
          <td style="text-align: center;">
            <div class="dual-inputs">
              <div class="dual-box">
                <span class="dual-label bar">Бар</span>
                <input type="number" 
                       class="fact-input" 
                       data-id="${item.id}" data-field="bar" 
                       value="${item.bar}" placeholder="0" 
                       oninput="updateItemFact(${item.id}, 'bar', this.value)">
              </div>
              <span style="color:var(--text-muted); padding-top:14px;">+</span>
              <div class="dual-box">
                <span class="dual-label wh">Склад</span>
                <input type="number" 
                       class="fact-input" 
                       data-id="${item.id}" data-field="wh" 
                       value="${item.wh}" placeholder="0" 
                       oninput="updateItemFact(${item.id}, 'wh', this.value)">
              </div>
            </div>
          </td>
          <td style="text-align: right;" id="diff-desktop-${item.id}">${badgeHtml}</td>
        </tr>
      `;
    }).join('');

    // Рендер карточек Мобильного
    const mobileContainer = document.getElementById('mobileCardsContainer');
    mobileContainer.innerHTML = filtered.map(item => {
      const total = getItemTotalFact(item);
      const hasFact = (total !== null);
      const diff = hasFact ? (total - item.amount) : 0;

      let cardClass = 'item-card';
      let badgeHtml = '';

      if (hasFact) {
        if (diff === 0) {
          cardClass += ' has-ok';
          badgeHtml = '<span class="diff-badge diff-ok">✓ Сошлось</span>';
        } else if (diff < 0) {
          cardClass += ' has-deficit';
          badgeHtml = `<span class="diff-badge diff-deficit">${diff} шт (${diff * item.cost} ₽)</span>`;
        } else {
          cardClass += ' has-surplus';
          badgeHtml = `<span class="diff-badge diff-surplus">+${diff} шт (+${diff * item.cost} ₽)</span>`;
        }
      }

      return `
        <div class="${cardClass}" id="card-${item.id}">
          <div class="card-top">
            <span class="item-category">${item.category}</span>
            <div class="card-meta">
              <span class="card-price">${item.cost} ₽</span>
              <span id="diff-mobile-${item.id}">${badgeHtml}</span>
            </div>
          </div>
          <div class="card-title">${item.title}</div>
          <div class="card-bottom">
            <div class="card-stock">
              <span class="card-stock-label">Остаток Шелл</span>
              <span class="stock-badge">${item.amount} шт</span>
              <span class="total-pill" id="total-mobile-${item.id}">
                ${hasFact ? `Факт: <b>${total} шт</b>` : `Факт: —`}
              </span>
            </div>
            <div class="dual-inputs">
              <div class="dual-box">
                <span class="dual-label bar">Бар</span>
                <input type="number" 
                       class="fact-input" 
                       inputmode="numeric"
                       data-id="${item.id}" data-field="bar" 
                       value="${item.bar}" placeholder="0" 
                       oninput="updateItemFact(${item.id}, 'bar', this.value)">
              </div>
              <span style="color:var(--text-muted); font-size:1.1rem; padding-bottom:6px;">+</span>
              <div class="dual-box">
                <span class="dual-label wh">Склад</span>
                <input type="number" 
                       class="fact-input" 
                       inputmode="numeric"
                       data-id="${item.id}" data-field="wh" 
                       value="${item.wh}" placeholder="0" 
                       oninput="updateItemFact(${item.id}, 'wh', this.value)">
              </div>
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  function updateStats() {
    let checkedCount = 0;
    let deficitSum = 0;
    let surplusSum = 0;

    goodsData.forEach(g => {
      const total = getItemTotalFact(g);
      if (total !== null) {
        checkedCount++;
        const diff = total - g.amount;
        if (diff < 0) deficitSum += Math.abs(diff) * g.cost;
        if (diff > 0) surplusSum += diff * g.cost;
      }
    });

    document.getElementById('statChecked').innerText = `${checkedCount} / ${goodsData.length}`;
    document.getElementById('statDeficit').innerText = `-${deficitSum} ₽`;
    document.getElementById('statSurplus').innerText = `+${surplusSum} ₽`;
  }

  function copyTelegramReport() {
    const now = new Date();
    const dateStr = now.toLocaleDateString('ru-RU') + ' ' + now.toLocaleTimeString('ru-RU', {hour: '2-digit', minute:'2-digit'});

    let report = `📊 *РЕВИЗИЯ БАРА // ${dateStr}*\n`;
    report += `━━━━━━━━━━━━━━━━━━━━━\n\n`;

    const deficits = [];
    const surpluses = [];
    let totalDeficit = 0;

    goodsData.forEach(g => {
      const total = getItemTotalFact(g);
      if (total !== null) {
        const diff = total - g.amount;
        const b = g.bar === '' ? 0 : g.bar;
        const w = g.wh === '' ? 0 : g.wh;

        if (diff < 0) {
          deficits.push(`🔴 ${g.title}: ${diff} шт (${diff * g.cost} ₽)\n   └ Бар: ${b} | Склад: ${w} (Факт: ${total} / Шелл: ${g.amount})`);
          totalDeficit += Math.abs(diff) * g.cost;
        } else if (diff > 0) {
          surpluses.push(`🔵 ${g.title}: +${diff} шт (+${diff * g.cost} ₽)\n   └ Бар: ${b} | Склад: ${w} (Факт: ${total} / Шелл: ${g.amount})`);
        }
      }
    });

    if (deficits.length === 0 && surpluses.length === 0) {
      report += `✅ *Все позиции сходятся, недостач нет!*\n`;
    } else {
      if (deficits.length > 0) {
        report += `*Недостачи:*\n${deficits.join('\n\n')}\n\n`;
      }
      if (surpluses.length > 0) {
        report += `*Излишки:*\n${surpluses.join('\n\n')}\n\n`;
      }
      report += `━━━━━━━━━━━━━━━━━━━━━\n`;
      report += `*ИТОГОВАЯ СУММА НЕДОСТАЧИ:* -${totalDeficit} ₽\n`;
    }

    navigator.clipboard.writeText(report).then(() => {
      const toast = document.getElementById('toast');
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 2200);
    });
  }
</script>
</body>
</html>
